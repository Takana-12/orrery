<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Orrery UI mock-up</title>
<style>
/* Orrery — a quiet instrument.
   One surface. Things are separated by space first, a hairline second, never by a box around each one.
   Colour means something or it is not used:
     brass (--acc)  = your move: the primary action, and whatever is waiting for you
     red            = a fault
   Everything else is ink on the surface; states are told apart by the shape of their icon.
   The only raised surfaces are the places you type into, and menus.
   Two radii: --r for those raised surfaces and buttons, --r-s for things inside them. */
:root {
  --bg: #12141d; --raise: #1b1e2b; --ink: #e4e6ee; --ink-2: #8a8fa3; --line: #292d3c;
  --acc: #d9b45f; --on-acc: #1b1608; --red: #f07a7a; --green: #6fca97;
  --tint: rgb(228 230 238 / .06); --tint-2: rgb(228 230 238 / .11);
  --shadow: 0 10px 28px rgb(0 0 0 / .45);
  --r: 8px; --r-s: 5px;
  --ui: "Bahnschrift", "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", "Segoe UI", system-ui, sans-serif;
  --mono: "Cascadia Mono", Consolas, "BIZ UDGothic", monospace;
  --rail-w: 292px;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f1f2f5; --raise: #ffffff; --ink: #181b27; --ink-2: #5f6578; --line: #d5d8e1;
    --acc: #8a6914; --on-acc: #ffffff; --red: #b93838; --green: #1c7a4b;
    --tint: rgb(24 27 39 / .05); --tint-2: rgb(24 27 39 / .1);
    --shadow: 0 10px 28px rgb(24 27 39 / .16);
  }
}
* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--ui); accent-color: var(--ink); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.grow { flex: 1; min-width: 0; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
svg.i.s { width: 15px; height: 15px; }
svg.i.l { width: 20px; height: 20px; }
.amber { color: var(--acc); } .red { color: var(--red); } .dim, .blue, .green { color: var(--ink-2); } .ion { color: var(--ink); }
@keyframes turn { to { transform: rotate(360deg); } }
svg.spin { animation: turn 1.4s linear infinite; color: var(--ink); }

/* ---------- the orrery: the mark, and the screen you see when nothing is waiting for you ---------- */
svg.orrery { flex: none; overflow: visible; }
.orrery .orbit { fill: none; stroke: var(--line); stroke-width: .7; }
.orrery .sun { fill: var(--acc); }
.orrery .planet { fill: var(--ink); }
.orrery .arm { transform-origin: 50px 50px; }
.orrery.live .a0 { animation: turn 9s linear infinite; }
.orrery.live .a1 { animation: turn 17s linear infinite; }
.orrery.live .a2 { animation: turn 29s linear infinite; }
.orrery.mark { width: 24px; height: 24px; }
.orrery.mark .orbit { stroke: var(--ink-2); stroke-width: 2.5; }
@media (prefers-reduced-motion: reduce) { svg.spin, .orrery .arm { animation: none !important; } }

/* ---------- controls ---------- */
button, input, textarea { font: inherit; color: inherit; }
button { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; padding: 6px 12px; border-radius: var(--r); border: 1px solid var(--line); background: transparent; cursor: pointer; }
button:hover:not(:disabled) { background: var(--tint); }
button.primary { background: var(--acc); color: var(--on-acc); border-color: var(--acc); font-weight: 700; }
button.primary:hover:not(:disabled) { background: var(--acc); filter: brightness(1.08); }
button.danger { color: var(--red); }
button.quiet { border-color: transparent; padding: 6px 8px; color: var(--ink-2); }
button.quiet:hover:not(:disabled) { color: var(--ink); }
button.ib { width: 32px; height: 32px; padding: 0; justify-content: center; flex: none; }
button:disabled { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
input[type=text], input[type=password], textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--raise); }
input[type=text]:focus-visible, input[type=password]:focus-visible { outline: none; border-color: var(--ink-2); }
textarea { resize: vertical; min-height: 76px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; overflow-x: hidden; }
::placeholder { color: var(--ink-2); opacity: .8; }
pre { font: 13px/1.5 var(--mono); margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
kbd { font: 11px/1.6 var(--mono); color: var(--ink-2); border: 1px solid var(--line); border-radius: var(--r-s); padding: 0 5px; flex: none; }
.banner { color: var(--acc); padding: 8px 16px; font-size: 13px; border-bottom: 1px solid var(--line); }

/* chips: every "choose one" control is a chip that opens a menu right where it stands. No outline until touched. */
button.chip { padding: 5px 8px; border-color: transparent; max-width: 100%; min-height: 32px; }
button.chip[aria-expanded=true] { background: var(--tint-2); }
button.chip .v { overflow: hidden; text-overflow: ellipsis; max-width: 22ch; }
button.chip .v:empty { display: none; }
button.chip .ic { display: inline-flex; }
button.chip > svg:first-child, button.chip .ic { color: var(--ink-2); }
button.chip .caret { color: var(--ink-2); width: 12px; height: 12px; }
button.chip[aria-pressed=true] { background: var(--tint-2); }
button.chip[aria-pressed=true] > svg { color: var(--acc); }

.menu { position: fixed; inset: auto; margin: 0; min-width: 232px; max-width: min(380px, calc(100vw - 16px)); max-height: min(440px, calc(100vh - 16px)); overflow: auto; padding: 5px; border: 1px solid var(--line); border-radius: var(--r); background: var(--raise); color: var(--ink); box-shadow: var(--shadow); font: 14px/1.5 var(--ui); }
/* a long list scrolls inside the menu, so whatever follows it (the effort gauge) stays in view */
.menu:popover-open { display: flex; flex-direction: column; }
.menu > * { flex: none; }
.menu > .menu-scroll { flex: 0 1 auto; min-height: 0; overflow: auto; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 9px; }
.menu-item { width: 100%; display: flex; gap: 10px; align-items: center; text-align: left; border: 0; border-radius: var(--r-s); padding: 7px 9px; }
.menu-item:hover:not(:disabled), .menu-item:focus-visible { background: var(--tint-2); outline: none; }
.menu-item .tx { flex: 1; min-width: 0; display: grid; }
.menu-item .tx span { overflow: hidden; text-overflow: ellipsis; }
.menu-item .sub { font: 11.5px/1.4 var(--mono); color: var(--ink-2); }
.menu-item kbd { border: 0; padding: 0; font-size: 12px; min-width: 15px; text-align: center; }

/* effort: a row of rising bars, in the menu (clickable) and on the chip (read-only) */
.fx { display: flex; align-items: center; gap: 10px; padding: 6px 9px 7px; }
.fx-bars { display: flex; align-items: flex-end; gap: 4px; height: 24px; flex: 1; }
.fx-bar { flex: 1; max-width: 26px; min-width: 0; padding: 0; height: 6px; border: 0; border-radius: 2px; background: var(--line); }
.fx-bar:hover:not(:disabled) { background: var(--ink-2); }
.fx-bar.on, .fx-bar.on:hover:not(:disabled) { background: var(--ink); }
.fx-bar:nth-child(2) { height: 10px; } .fx-bar:nth-child(3) { height: 14px; } .fx-bar:nth-child(4) { height: 18px; } .fx-bar:nth-child(5) { height: 21px; } .fx-bar:nth-child(n+6) { height: 24px; }
.fx-word { min-width: 4.5em; text-align: right; }
.fx-mini { display: inline-flex; align-items: flex-end; gap: 2px; height: 13px; }
.fx-mini i { width: 3px; height: 4px; border-radius: 1px; background: var(--ink-2); opacity: .45; }
.fx-mini i.on { background: var(--ink); opacity: 1; }
.fx-mini i:nth-child(2) { height: 6px; } .fx-mini i:nth-child(3) { height: 8px; } .fx-mini i:nth-child(4) { height: 10px; } .fx-mini i:nth-child(5) { height: 11.5px; } .fx-mini i:nth-child(n+6) { height: 13px; }

/* the composer: the text, and under it a bar with its controls; the go button is at the right */
.composer { border: 1px solid var(--line); border-radius: var(--r); background: var(--raise); }
.composer:focus-within { border-color: var(--ink-2); }
.composer.dropping { border-style: dashed; border-color: var(--ink); }
.composer textarea { display: block; border: 0; border-radius: var(--r); background: transparent; padding: 12px 14px 6px; resize: none; min-height: 52px; max-height: 240px; outline: none; }
.composer .bar { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; padding: 4px 8px 8px; }
.composer .bar > .primary { margin-left: auto; }
.composer .bar .note { display: inline-flex; gap: 6px; align-items: center; padding-left: 6px; }
.composer .folder { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; padding: 8px 8px 0; }
.composer .folder input { background: transparent; }
.attached { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 0 6px; }
.att { display: inline-flex; align-items: center; gap: 6px; padding: 3px 2px 3px 6px; border-radius: var(--r-s); background: var(--tint); font-size: 13px; max-width: 100%; }
.att img { width: 28px; height: 28px; object-fit: cover; border-radius: 3px; flex: none; }
.att .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 24ch; }
.att button { padding: 3px; border-radius: var(--r-s); }

/* ---------- frame ---------- */
.app { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); height: 100%; }
.rail { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
.main { min-height: 0; overflow: auto; }
.pad { max-width: 820px; margin: 0 auto; padding: 22px 28px 60px; }

/* ---------- rail: a plain list. Rows are parted by hairlines that stop short of both edges. ---------- */
.rail-top { padding: 12px 10px 8px 16px; display: flex; align-items: center; gap: 9px; }
.brand { font-weight: 600; font-size: 17px; letter-spacing: .12em; flex: 1; }
.tally { display: flex; gap: 2px; margin: 0 6px 4px; font-variant-numeric: tabular-nums; }
.tally > * { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 0; border: 0; border-radius: var(--r-s); }
.tally b { font-size: 15px; font-weight: 600; line-height: 1.2; }
.tally .zero { opacity: .4; }
.tally .zero svg { color: inherit; }
.tally > :not(.zero):has(.amber) b { color: var(--acc); }
.tally > :not(.zero):has(.red) b { color: var(--red); }
.home[aria-current=page] { background: var(--tint-2); }
.rail-scroll { flex: 1; overflow: auto; padding: 0 6px 10px; }
.group { margin: 14px 10px 2px; font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.strip { position: relative; width: 100%; display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 0 8px; align-items: center; text-align: left; padding: 8px 10px; border: 0; border-radius: var(--r-s); white-space: normal; }
.strip + .strip::before { content: ""; position: absolute; top: 0; left: 10px; right: 10px; border-top: 1px solid var(--line); }
.strip[aria-current=page] { background: var(--tint-2); }
.strip:hover::before, .strip:hover + .strip::before, .strip[aria-current=page]::before, .strip[aria-current=page] + .strip::before { border-color: transparent; }
.strip .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.strip .sub { grid-column: 2 / 4; font-size: 12px; color: var(--ink-2); display: flex; gap: 6px; align-items: center; min-width: 0; }
.strip .sub .p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.strip .sub .age { margin-left: auto; flex: none; font-variant-numeric: tabular-nums; }
.strip .now { grid-column: 2 / 4; font: 11.5px/1.5 var(--mono); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; gap: 4px; align-items: center; }
.strip .now.quiet { color: var(--acc); }
.new-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--acc); }
.more { font-size: 12px; }
.rail-foot { margin: 0 16px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 2px; font-variant-numeric: tabular-nums; }
.rail-foot .grow { display: flex; align-items: center; gap: 6px; }
.rail-empty { padding: 18px 10px; font-size: 13px; color: var(--ink-2); }

/* ---------- headings ---------- */
h1 { font-size: 18px; font-weight: 600; margin: 0 0 14px; display: flex; align-items: center; gap: 9px; }
h1 > svg { color: var(--ink-2); }
h1 .n { font-variant-numeric: tabular-nums; }
h2 { font-size: 14px; font-weight: 600; margin: 30px 0 4px; display: flex; align-items: center; gap: 8px; }
.note { font-size: 12.5px; color: var(--ink-2); }
.err { color: var(--red); font-size: 13px; }
.err:empty { display: none; }

/* ---------- nothing waiting: the one place the orrery is drawn large ---------- */
.clear { display: grid; justify-items: center; gap: 14px; padding: 44px 24px 36px; }
.clear .orrery { width: 190px; height: 190px; }
.clear strong { font-size: 16px; font-weight: 600; }
.clear .counts { display: flex; gap: 16px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.clear .counts span { display: inline-flex; gap: 6px; align-items: center; }

/* ---------- a request: a block between two hairlines, not a card ---------- */
.ticket, .steps { border-top: 1px solid var(--line); padding: 14px 0 18px; }
.ticket.answering { opacity: .7; }
.ticket:focus-visible { outline-offset: 6px; }
.ticket-head { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); min-width: 0; }
.ticket-head .kind { color: var(--acc); font-weight: 600; display: inline-flex; gap: 6px; align-items: center; flex: none; }
.ticket-head .where { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ticket-head .age { margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.ask, .clear strong, .result .t, h1 { word-break: auto-phrase; text-wrap: pretty; }
.narrow-only { display: none; margin-left: auto; font-size: 14px; }
.ask { font-size: 17px; font-weight: 600; line-height: 1.45; margin: 8px 0 8px; overflow-wrap: anywhere; }
.ask .opt-mark { font-size: 12.5px; font-weight: 400; color: var(--ink-2); margin-left: 6px; }
.choice { display: flex; gap: 10px; align-items: flex-start; padding: 7px 10px; margin: 0 -10px; border-radius: var(--r-s); cursor: pointer; }
.choice:hover { background: var(--tint); }
.choice:has(input:checked) { background: var(--tint-2); }
.choice input { margin-top: 5px; flex: none; }
.choice .lab { flex: 1; min-width: 0; }
.choice small { display: block; color: var(--ink-2); }
.ticket input[type=text], .ticket input[type=password] { margin-top: 8px; }
.subject { background: var(--raise); border-radius: var(--r-s); padding: 10px 12px; margin: 6px 0; max-height: 320px; overflow: auto; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--ink-2); margin: 6px 0 0; }
.facts span { display: inline-flex; gap: 5px; align-items: center; min-width: 0; }
.facts code { font-family: var(--mono); color: var(--ink); overflow-wrap: anywhere; }
/* actions: refusals sit at the left, whatever moves the work forward sits at the right edge */
.acts { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; justify-content: flex-end; }
details.raw { margin-top: 10px; font-size: 13px; }
details.raw summary { cursor: pointer; color: var(--ink-2); }
details.raw .subject { margin-top: 6px; }
.diff { font: 12.5px/1.5 var(--mono); border-radius: var(--r-s); margin: 6px 0; max-height: 340px; overflow: auto; background: var(--raise); }
.diff .file { padding: 4px 10px; background: var(--raise); border-bottom: 1px solid var(--line); font-weight: 700; position: sticky; top: 0; display: flex; gap: 6px; align-items: center; }
.diff .ln { padding: 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.diff .add { background: color-mix(in srgb, var(--green) 16%, transparent); }
.diff .del { background: color-mix(in srgb, var(--red) 16%, transparent); }
.diff .hunk { color: var(--ink-2); }

/* ---------- result rows (finished work not yet looked at): a list, parted by hairlines ---------- */
.result { width: 100%; display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 2px 10px; text-align: left; padding: 10px 0; border: 0; border-top: 1px solid var(--line); border-radius: 0; white-space: normal; align-items: start; }
.result > svg { margin-top: 3px; }
.result .t { font-weight: 600; }
.result .x { grid-column: 2; color: var(--ink-2); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.result .age { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* ---------- session screen ---------- */
.session { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
.s-head { padding: 10px 16px 9px 20px; border-bottom: 1px solid var(--line); }
.s-title { display: flex; align-items: center; gap: 6px; min-width: 0; }
.s-title h1 { margin: 0; font-size: 17px; min-width: 0; flex: 0 1 auto; }
.s-title h1 span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.s-title .back { display: none; }
.s-state { display: inline-flex; gap: 6px; align-items: center; margin-left: auto; padding: 0 8px; font-variant-numeric: tabular-nums; }
.s-acts { display: flex; gap: 2px; align-items: center; }
.s-acts .ib:not(.primary) { border-color: transparent; color: var(--ink-2); }
.s-acts .ib.danger { color: var(--red); }
.s-acts .primary { padding: 0 10px; height: 32px; margin-left: 6px; }
.s-meta { display: flex; flex-wrap: wrap; gap: 3px 16px; margin-top: 4px; font-size: 12.5px; color: var(--ink-2); align-items: center; }
.s-meta span { display: inline-flex; gap: 5px; align-items: center; min-width: 0; max-width: 100%; }
.s-meta .path { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46ch; }
.s-body { overflow: auto; padding: 16px 20px 8px; }
.s-body .inner { max-width: 780px; margin: 0 auto; }
.msg { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 0 10px; margin-bottom: 14px; }
.msg > svg { margin-top: 3px; color: var(--ink-2); }
.msg .text { white-space: pre-wrap; overflow-wrap: anywhere; }
.msg .when { font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.msg.user .text { background: var(--raise); border-radius: var(--r); padding: 8px 12px; }
.msg.tool, .msg.system { margin-bottom: 6px; }
.msg.tool .text, .msg.system .text, .msg.tool summary { font: 12.5px/1.5 var(--mono); color: var(--ink-2); }
.msg.tool summary { cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msg.tool details[open] summary { white-space: pre-wrap; }
.msg.tool pre { margin-top: 4px; padding: 8px 10px; background: var(--raise); border-radius: var(--r-s); max-height: 300px; overflow: auto; }
.s-jump { position: sticky; bottom: 6px; display: flex; justify-content: center; }
.s-jump button { background: var(--raise); }
.s-foot { padding: 4px 20px 14px; max-height: 70vh; overflow: auto; }
.s-foot .inner { max-width: 780px; margin: 0 auto; }
.s-foot .composer { margin-top: 4px; }

/* ---------- forms & lists ---------- */
form.new { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.row { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 2px 10px; padding: 9px 0; border-top: 1px solid var(--line); align-items: center; }
.row .x { grid-column: 2; font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.row > button.quiet { justify-content: flex-start; color: var(--ink); min-width: 0; }

/* ---------- verdicts, settings ---------- */
.verdict { margin-top: 8px; }
.verdict:empty { display: none; }
.verdict-line { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.verdict-line > button:first-of-type { margin-left: auto; }
.verdict-line code, .row code { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
.verdict-line button { padding: 4px 10px; font-size: 13px; }
.verdict details.raw { margin-top: 6px; }
.result.verdict-row { align-items: center; }
.result.verdict-row > svg { margin-top: 0; }
.result.verdict-row .t { justify-content: flex-start; padding: 2px 4px; font-weight: 600; color: var(--ink); white-space: normal; text-align: left; }
.result.verdict-row .x { grid-column: 2 / 4; }
.stepper { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 8px; }
.stepper .big { font-size: 24px; font-weight: 600; min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; }
.stepper input { width: 9ch; }
.row.env .env-acts { display: flex; gap: 4px; }
.env-new { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) auto; gap: 8px; margin-top: 8px; }
button.quiet.danger { color: var(--red); }

/* ---------- sign-in notice, usage ---------- */
.auth-box:empty { display: none; }
.auth-box { padding: 0 16px 8px; }
.auth-alert { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
.auth-alert strong { display: block; }
.auth-alert .acts { margin-top: 8px; }
.auth-alert .note { display: flex; gap: 6px; align-items: flex-start; }
.svc { border-top: 1px solid var(--line); padding: 16px 0 18px; }
.svc h2 { margin: 0 0 10px; }
